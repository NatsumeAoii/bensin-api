name: Sync Pertamina Prices

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

# Prevent overlapping scheduled + manual runs from racing on the git push.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
      - name: Run generator (fetch upstream)
        run: |
          python pipeline/fetch_normalize.py --fetch
      - name: Run tests
        run: |
          python -m pytest pipeline/tests/
      - name: Data sanity check
        run: |
          python -m pipeline.sanity_check
      - name: Generated tree check
        run: python -m pipeline.generated_tree_check
      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          unexpected="$(git status --porcelain | awk '{print $2}' | grep -Ev '^(price\.json|v1/)' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:"
            printf '%s\n' "$unexpected"
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git diff --exit-code -- . ':!price.json' ':!v1/'
            git add price.json v1/
            git commit -m "chore: update v1 snapshots"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
